name: Maataa Sovereign Runtime CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the verified build to the isolated staging Worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install System Toolchain & iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog binaryen

      - name: Setup Rust & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Phase 0 disk-capacity preflight
        run: node scripts/check-disk-space.mjs 6

      - name: Phase 0 repository hygiene
        run: node scripts/repository-hygiene.mjs

      - name: Step 0 - Verify generated cross-runtime contracts
        run: |
          npm ci
          npm run contracts:check
          npm run contracts:python-check

      - name: Step 1 - Execute Verilog Hardware Simulation
        run: make sim sim-top rtl-check

      - name: Step 2 - Native Rust Tests
        run: cargo test --release

      - name: Step 3 - Build Production WASM Module
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          ./scripts/build-edge.sh

      - name: Step 4 - Node Dependencies & Vitest E2E Suite
        run: npx vitest run

      - name: Step 5 - Type-check Worker and SDK examples
        run: npx tsc --noEmit

      - name: Step 6 - Validate isolated staging bundle
        run: npx wrangler deploy --dry-run --env staging

  verify-desktop:
    name: Siddham desktop (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/siddham-authority-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/siddham-authority-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Phase 0 disk-capacity preflight
        working-directory: .
        run: node scripts/check-disk-space.mjs 6
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install desktop dependencies
        run: npm ci
      - name: Verify generated desktop contract binding
        working-directory: .
        run: npm run contracts:check
      - name: Type-check and build desktop UI
        run: npm run check
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint Rust authority
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test Rust authority
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop application without bundle
        run: npm run desktop:build -- --no-bundle

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging
    needs: verify-stack
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          npm ci
      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          packageManager: npm
