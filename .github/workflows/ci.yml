name: MAATAA Siddham reproducible CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the verified build to the isolated staging Worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: 0.13.1
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  verify-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen iverilog yosys libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pinned Rust helpers
        run: |
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Validate clean checkout
        run: |
          npm run preflight:disk
          npm run hygiene:check
      - name: Install locked dependencies
        run: npm ci && npm ci --prefix apps/siddham-authority-desktop
      - name: Validate structured files and contracts
        run: |
          npm run validate:structured
          npm run contracts:check
          npm run contracts:python-check
      - name: Validate licenses and dependency security
        run: |
          npm run licenses:check
          npm run security:npm
          npm run security:cargo
      - name: Lint and test Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build WASM before consumer tests
        run: npm run build:wasm
      - name: Test TypeScript, Worker, Python, and RTL consumers
        run: |
          npm test
          npx tsc --noEmit
          npm run test:rtl
      - name: Build desktop frontend
        run: npm run desktop:check
      - name: Validate staging Worker bundle
        run: npm run edge:dry-run
      - name: Normalize generated Tauri schemas
        run: |
          git restore --worktree apps/siddham-authority-desktop/src-tauri/gen/schemas
          git clean -f -- apps/siddham-authority-desktop/src-tauri/gen/schemas
          git status --short
          test -z "$(git status --porcelain)"
      - name: Package checksummed release artifacts
        run: npm run artifacts:package
      - uses: actions/upload-artifact@v4
        with:
          name: maataa-siddham-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  verify-desktop:
    name: Siddham desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/siddham-authority-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/siddham-authority-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install desktop dependencies
        run: npm ci
      - name: Verify generated desktop contract binding
        working-directory: .
        run: npm run contracts:check
      - name: Type-check and build desktop UI
        run: npm run check
      - name: Format Rust authority
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint Rust authority
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test Rust authority
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop application without bundle
        run: npm run desktop:build -- --no-bundle

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging
    needs: [verify-stack, verify-desktop]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown
      - name: Install pinned build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          npm ci
      - name: Build governed Worker input
        run: npm run build:wasm
      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          packageManager: npm
