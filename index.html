<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>allb.xyz - Z0 Vault Client</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #f8fafc; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2563eb; }
        pre { background: #090d16; padding: 10px; border-radius: 4px; overflow-x: auto; color: #38bdf8; }
    </style>
</head>
<body>

    <h2>Z0-Vault Client Dashboard (`allb.xyz`)</h2>

    <div class="card">
        <h3>1. Identity & WebCrypto Keypair</h3>
        <button id="btn-gen-key">Generate Ed25519 Wallet</button>
        <p>Public Key: <span id="pub-key-display">Not Generated</span></p>
    </div>

    <div class="card">
        <h3>2. Demurrage Decay Preview</h3>
        <p>Principal: 1000.00 Z0 | Rate: 5% per annum</p>
        <p>Elapsed Time: 180 Days (~0.493 Years)</p>
        <p>Decayed Balance: <strong><span id="decayed-balance">---</span> Z0</strong></p>
    </div>

    <div class="card">
        <h3>3. Sign Payload</h3>
        <button id="btn-sign-tx">Sign Mock Transaction</button>
        <pre id="tx-output">// Transaction output will appear here...</pre>
    </div>

    <script type="module">
        import { Z0VaultWallet, calculateDemurrageBalance } from './z0_client.js';

        const wallet = new Z0VaultWallet();

        // Calculate sample demurrage balance (1000 Z0 over 180 days at 5% rate)
        const nowSec = Math.floor(Date.now() / 1000);
        const halfYearAgoSec = nowSec - (180 * 86400);
        const decayed = calculateDemurrageBalance(1000.0, 0.05, halfYearAgoSec, nowSec);
        document.getElementById('decayed-balance').textContent = decayed;

        // WebCrypto Key Generation Handler
        document.getElementById('btn-gen-key').addEventListener('click', async () => {
            const keys = await wallet.generateKeypair();
            document.getElementById('pub-key-display').textContent = keys.publicKey;
        });

        // Sign Transaction Handler
        document.getElementById('btn-sign-tx').addEventListener('click', async () => {
            try {
                const txPayload = {
                    sender: wallet.publicKeyHex || "0x_anonymous",
                    recipient: "z0_vault_pool_0x99",
                    amount: 50.0,
                    timestamp: Math.floor(Date.now() / 1000)
                };
                const signedTx = await wallet.signTransaction(txPayload);
                document.getElementById('tx-output').textContent = JSON.stringify(signedTx, null, 2);
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
