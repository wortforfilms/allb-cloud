  identity: { deviceId:"EDGE-0007",certificate:"VALID",issuer:"Siddham Root CA",validUntil:"2027-05-18",attestation:"PASSED" },
  securityStatus: [{name:"TPM",status:"ENABLED"},{name:"Disk Encryption",status:"ENABLED"},{name:"Secure Storage",status:"ENABLED"}],
  update: { version:"v2.3.1",rolloutId:"ROL-2025-08-10-01",target:"Mumbai North",progress:62,devices:"86 / 42",started:"10:30:15 IST",eta:"10:40:15 IST",size:"154.3 MB",signature:"VALID",publisher:"Siddham Release Authority" },
  rollout: [{name:"Download",status:"COMPLETED"},{name:"Verify",status:"COMPLETED"},{name:"Pre-checks",status:"COMPLETED"},{name:"Install",status:"IN PROGRESS"},{name:"Post-checks",status:"PENDING"},{name:"Reboot",status:"PENDING"}],
  sdkCode: ["from siddham_edge import EdgeSDK","sdk = EdgeSDK(device='local')","model = sdk.load_model('vehicle-detector-v2')","result = model.run(frame)","print(result.decision)"],
  sdkTools: ["Model Converter","Rule Linter","Determinism Checker","Performance Profiler","Log Analyzer"],
  release: { version:"v2.3.1",submittedBy:"build-bot@siddham.com",submittedAt:"2026-08-02 00:45 IST",changes:"OS 2.3.1, Models, Rules",evidenceBundle:"EVB-2026-08-10-01" },
  pipeline: [{name:"Build",status:"done"},{name:"Tests",status:"done"},{name:"Security",status:"done"},{name:"Evidence",status:"done"},{name:"Approval",status:"active"},{name:"Publish",status:"pending"}],
  approvers: [{role:"Security Lead",name:"sec.lead@siddham.com",status:"PENDING"},{role:"QA Lead",name:"qa.lead@siddham.com",status:"APPROVED"},{role:"Operations Lead",name:"ops.lead@siddham.com",status:"PENDING"}]
};
</script>
  <script>(function(){
  const D=window.SIDDHAM_EDGE, nav=document.getElementById("primary-nav"), page=document.getElementById("page"), crumb=document.getElementById("crumb");
  const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const status=v=>`<span class="${esc(v)}">${esc(v)}</span>`;
  const panel=(title,body,meta="")=>`<section class="panel"><div class="panel-title"><h2>${title}</h2><span>${meta}</span></div>${body}</section>`;
  const heading=(title,state,copy)=>`<div class="page-heading"><div><span class="kicker">SIDDHAM EDGE · CONTROLLED DEMO</span><h1>${title}</h1><p>${copy}</p></div><div class="page-actions"><span class="state ${state}">${state.toUpperCase()}</span><button class="btn" data-toast="Report fixture exported">EXPORT</button><button class="btn primary" data-toast="Action captured locally">PRIMARY ACTION</button></div></div>`;
  const metric=(label,value,note,tone="")=>`<article class="metric ${tone}"><small>${label}</small><strong>${value}</strong><em>${note}</em></article>`;
  const bars=(items,gold=false)=>`<div class="bars">${items.map(x=>`<div class="bar-row"><span>${esc(x.name)}</span><div class="bar ${gold?"gold":""}"><i style="width:${Number(x.value)}%"></i></div><b>${esc(x.value)}%</b></div>`).join("")}</div>`;
  const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const tabs=(labels,active=0)=>`<div class="tabs">${labels.map((x,i)=>`<button class="${i===active?"active":""}" data-tab>${x}</button>`).join("")}</div>`;
  const feed=items=>`<div class="feed">${items.map(x=>`<div class="feed-row"><i class="${x.level}"></i><span>${esc(x.text)}</span><time>${esc(x.time)}</time></div>`).join("")}</div>`;
  function lineChart(){const max=100,w=620,h=170,pts=(key)=>D.telemetry.map((d,i)=>`${20+i*(w-40)/(D.telemetry.length-1)},${h-20-(d[key]/max)*(h-40)}`).join(" ");return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="NPU and CPU telemetry over time">${[30,70,110,150].map(y=>`<line class="grid-line" x1="20" y1="${y}" x2="600" y2="${y}"/>`).join("")}<polyline class="line-a" points="${pts("npu")}"/><polyline class="line-b" points="${pts("cpu")}"/><text class="chart-label" x="22" y="15">NPU</text><text class="chart-label" x="70" y="15">CPU</text></svg></div>`}
  function command(){return heading("Command Centre","concept","Fleet health, deterministic inference and evidence status across the local authority plane.")+`<div class="grid metrics">${metric("Fleet health",D.metrics.fleetHealth+"%","controlled fixture","green")}${metric("Devices online",`${D.metrics.devicesOnline}/${D.metrics.devicesTotal}`,"demo fleet")}${metric("Critical alerts",D.metrics.alerts,"requires review","red")}${metric("Determinism",D.metrics.determinism+"%","reference evaluation","green")}</div><div class="grid two" style="margin-top:12px">${panel("NPU utilisation",lineChart(),"NPU · CPU")}${panel("System status",bars(D.resources),"EDGE-0007")}</div><div class="grid two" style="margin-top:12px">${panel("Recent inferences",table(["ID","Model","Decision","Time"],D.inferences.map(x=>[`<strong>${x.id}</strong>`,x.model,status(x.decision),x.time]))) }${panel("System feed",feed(D.feed),"live fixture")}</div>${demo()}`}
  function edgeDevice(){const x=D.device;return heading("Edge Device","reference","Detailed local device health, resources, connectivity and hardware identity.")+`${panel("Device overview",`${tabs(["Overview","Hardware","Software","Storage","Network","Logs"])}<div class="device-hero"><div><div class="device-art"><div class="device-box">सिद्धम्</div></div><h2>${x.id} <span class="good">● ${x.status}</span></h2><p class="text-muted">${x.model} · ${x.version} · ${D.meta.location}</p></div><div class="device-data">${[["Uptime",x.uptime],["Local time",x.localTime],["Last sync",x.lastSync],["Zone",D.meta.zone]].map(v=>`<div class="keyval"><small>${v[0]}</small><b>${v[1]}</b></div>`).join("")}</div></div>`) }<div class="grid two-equal" style="margin-top:12px">${panel("Compute",bars(D.resources),"resource fixture")}${panel("Health",`${[["Temperature",x.temperature],["Power",x.power],["Voltage",x.voltage],["Fan speed",x.fan]].map(v=>`<div class="feed-row"><i class="ok"></i><span>${v[0]}</span><b>${v[1]}</b></div>`).join("")}`)}</div><div class="grid two-equal" style="margin-top:12px">${panel("Storage",bars([{name:"Used",value:x.storageUsed/x.storageTotal*100}]),`${x.storageUsed} GB / ${x.storageTotal} GB`)}${panel("Network",`<div class="keyval"><small>Interface</small><b>${x.network}</b></div><div class="keyval"><small>Signal</small><b>${x.signal}</b></div>`)}</div>${demo()}`}
  function liveInference(){return heading("Live Inference","concept","Vision inference is a candidate generator; rule and evidence gates retain release authority.")+`<div class="grid two"><section class="panel"><div class="panel-title"><h2>Camera stream</h2><span>CAM-GATE-2</span></div><div class="vision"><div class="road"></div><i class="vehicle" data-label="car .94" style="left:19%;top:44%;width:18%;height:25%"></i><i class="vehicle" data-label="truck .91" style="left:50%;top:35%;width:23%;height:33%"></i><i class="vehicle" data-label="bus .89" style="left:73%;top:28%;width:17%;height:38%"></i></div></section><div>${panel("Inference panel",`${tabs(["Model","Threshold","Mode"])}<div class="keyval"><small>Model</small><b>vehicle-detector-v2</b></div><div class="decision-card"><small>CURRENT DECISION</small><strong>ALLOW</strong><small>Deterministic mode · rules passed</small></div>`)}${panel("Performance",bars(D.resources),"fixture")}</div></div><div style="margin-top:12px">${panel("Detections",table(["Class","Confidence","Bounding box","Decision"],D.detections.map(x=>[x.class,x.confidence,`<code>${x.box}</code>`,status(x.decision)])))}</div>${demo()}`}
  function rules(){return heading("Panini Rule Engine","reference","Formal rule evaluation, typed variables and deterministic trace for a selected candidate.")+`<div class="grid two"><div>${panel("Active rule",`${tabs(["Rule set","Rule trace","Simulator"])}<p><strong>${D.activeRule.id}</strong> · ${D.activeRule.name} · <span class="good">${D.activeRule.status}</span></p><pre class="code">${D.activeRule.source.map(esc).join("\n")}</pre>`)}${panel("Variables",table(["Name","Type","Value"],D.variables.map(x=>[x.name,x.type,`<code>${x.value}</code>`])))}</div><div>${panel("Rule trace",`<ol class="trace">${D.ruleTrace.map(x=>`<li><i>✓</i><span>${x}</span><time>10:34:28</time></li>`).join("")}`)}${panel("Outcome",`<div class="outcome">FLAG</div><div class="hash-box">decision: HUMAN_REVIEW · trace: A18-C14-6F6</div>`)}</div></div>${demo()}`}
  function evidence(){return heading("Evidence Gate","reference","Append-only evidence state, hashes and freshness before any release or consequential action.")+`<div class="grid metrics">${metric("Evidence items",D.metrics.evidenceTotal,"fixture total")}${metric("Verified",D.metrics.evidenceVerified,"98.9%","green")}${metric("Pending",D.metrics.evidencePending,"awaiting verification")}${metric("Failed",D.metrics.evidenceFailed,"blocked","red")}</div><div style="margin-top:12px">${panel("Evidence ledger",table(["ID","Source","Type","Hash SHA-256","Time","Status"],D.evidence.map(x=>[`<strong>${x.id}</strong>`,x.source,x.type,`<code>${x.hash}</code>`,x.time,status(x.status)])))}</div><div class="grid two-equal" style="margin-top:12px">${panel("Merkle root · current window",`<div class="hash-box">7a3f2c9b6e14f8a2c7b5e6d17a21b8d1…</div><p class="text-muted">Window: 15 minutes · local fixture</p>`)}${panel("Store",`<div class="feed-row"><i class="ok"></i><span>Local store</span><b>ACTIVE</b></div><div class="feed-row"><i class="ok"></i><span>Tamper evidence</span><b>ENABLED</b></div>`)}</div>${demo()}`}
  function models(){return heading("Models & Workloads","planned","Model registry, deployment state, target assignment and controlled rollback.")+`${panel("Model registry",`${tabs(["Models","Workloads","Deployments"])}${table(["Model","Version","Type","Size","Status"],D.models.map(x=>[`<strong>${x.name}</strong>`,x.version,x.type,x.size,status(x.status)]))}`)}<div class="grid two-equal" style="margin-top:12px">${panel("Deployment target",table(["Device","Location","Version","Status"],[["EDGE-0007","Mumbai Gate 7","2.1.0",status("DEPLOYED")]]))}${panel("Resource fit",bars(D.resources),"estimated fixture")}</div>${demo()}`}
  function sensors(){return heading("Sensors & I/O","reference","Sensor registry, signal quality, typed ports and calibration status.")+`${panel("Sensor registry",`${tabs(["Sensors","I/O","Calibration"])}${table(["Sensor","Type","Status","Value","Health"],D.sensors.map(x=>[`<strong>${x.name}</strong>`,x.type,status(x.status),x.value,status(x.health)]))}`)}<div class="grid two-equal" style="margin-top:12px">${panel("I/O ports",table(["Port","Device","State"],D.ports.map(x=>[x.name,x.device,status(x.state)])))}${panel("Signal quality",D.signal.map(x=>`<div class="bar-row"><span>${x.name}</span><div class="bar"><i style="width:${x.value}%"></i></div><b>${x.label}</b></div>`).join(""))}</div>${demo()}`}
  function fleet(){return heading("Fleet Manager","concept","Workspace-scoped device fleet, groups and controlled alert handling.")+`<div class="grid two"><section class="panel"><div class="panel-title"><h2>Fleet map</h2><span>conceptual positions</span></div><div class="fleet-map">${D.fleetNodes.map(x=>`<i class="map-node ${x.state}" style="left:${x.x}%;top:${x.y}%">${x.n}</i>`).join("")}</div></section><div>${panel("Device summary",`${[["Total",D.fleet.total],["Online",D.fleet.online],["Warning",D.fleet.warning],["Offline",D.fleet.offline]].map(v=>`<div class="feed-row"><i class="${v[0].toLowerCase()==="offline"?"critical":v[0].toLowerCase()==="warning"?"warning":"ok"}"></i><span>${v[0]}</span><b>${v[1]}</b></div>`).join("")}`)}${panel("Recent alerts",feed(D.feed.slice(0,3)))}${panel("Groups",D.fleet.groups.map(x=>`<div class="feed-row"><i class="info"></i><span>${x.name}</span><b>${x.count}</b></div>`).join(""))}</div></div>${demo()}`}
  function security(){return heading("Device Security","reference","Secure boot, device identity, attestation and protected local state.")+`<div class="grid two"><div>${panel("Secure boot chain",`<div class="boot-chain">${D.secureBoot.map((x,i)=>`<div class="boot-step"><i>${i+1}</i><span>${x.name}</span>${status(x.status)}</div>`).join("")}</div>`)}${panel("Last attestation",`<div class="feed-row"><i class="ok"></i><span>10:24:30 IST</span><b class="good">${D.identity.attestation}</b></div>`)}</div><div>${panel("Device identity",Object.entries(D.identity).filter(([k])=>k!=="attestation").map(([k,v])=>`<div class="feed-row"><i class="ok"></i><span>${k}</span><b>${v}</b></div>`).join(""))}${panel("Security status",`<div class="security-items">${D.securityStatus.map(x=>`<div class="security-item"><b>⌾</b><small>${x.name}</small><em class="good">${x.status}</em></div>`).join("")}</div>`)}</div></div>${demo()}`}
  function ota(){return heading("OTA Updates","planned","Signed staged rollout with verification, rollback protection and post-update evidence.")+`<div class="grid two"><div>${panel("Active rollout",`${tabs(["Updates","Rollouts","History"])}${[["Update",D.update.version],["Rollout ID",D.update.rolloutId],["Target",D.update.target],["Progress",D.update.progress+"%"],["Devices",D.update.devices],["Started",D.update.started],["ETA",D.update.eta]].map(v=>`<div class="feed-row"><i class="info"></i><span>${v[0]}</span><b>${v[1]}</b></div>`).join("")}<div class="bar"><i style="width:${D.update.progress}%"></i></div>`)}${panel("Update package",`${[["Version",D.update.version],["Size",D.update.size],["Signature",D.update.signature],["Published by",D.update.publisher]].map(v=>`<div class="feed-row"><i class="ok"></i><span>${v[0]}</span><b>${v[1]}</b></div>`).join("")}`)}</div>${panel("Rollout stages",`<div class="boot-chain">${D.rollout.map((x,i)=>`<div class="boot-step"><i>${x.status==="COMPLETED"?"✓":i+1}</i><span>${x.name}</span>${status(x.status.replace(" ","-"))}</div>`).join("")}</div>`)} </div>${demo()}`}
  function sdk(){return heading("Developer SDK","scaffolded","Local SDK contract for models, rules, deterministic checks and device packaging.")+`<div class="grid two"><div>${panel("Quick start",`${tabs(["SDK Home","Examples","Tools","Docs"])}<pre class="code">${D.sdkCode.map(esc).join("\n")}</pre>`)}${panel("SDK information",table(["SDK version","Language","Platform","License"],[["0.9.0-beta","Python API","Linux arm64","Siddham Edge SDK License"]]))}</div>${panel("SDK tools",`<div class="sdk-tools">${D.sdkTools.map(x=>`<button class="sdk-tool btn" data-toast="${x} opened">${x}</button>`).join("")}</div>`)}</div>${demo()}`}
  function release(){return heading("Release Authority","reference","Human-controlled promotion after build, tests, security and evidence gates.")+`${panel("Release pipeline",`<div class="timeline">${D.pipeline.map(x=>`<div class="timeline-step ${x.status}"><i></i><span>${x.name}</span></div>`).join("")}</div>`)}<div class="grid two" style="margin-top:12px"><div>${panel("Approval required",`${Object.entries(D.release).map(([k,v])=>`<div class="feed-row"><i class="info"></i><span>${k}</span><b>${v}</b></div>`).join("")}<div class="page-actions" style="margin-top:12px"><button class="btn" data-toast="Release remains pending">REJECT</button><button class="btn primary" data-toast="Demo approval recorded locally">APPROVE</button></div>`)} </div><div>${panel("Approvers",table(["Role","Identity","Status"],D.approvers.map(x=>[x.role,x.name,status(x.status)])))}${panel("Approval policy",`<p><strong>2 of 3 approvals required</strong></p><p class="text-muted">Release Authority AAL3 and fresh evidence bundle are mandatory.</p>`)}</div></div>${demo()}`}
  const renderers={"command-centre":command,"edge-device":edgeDevice,"live-inference":liveInference,"panini-rule-engine":rules,"evidence-gate":evidence,"models-workloads":models,"sensors-io":sensors,"fleet-manager":fleet,"device-security":security,"ota-updates":ota,"developer-sdk":sdk,"release-authority":release};
  function demo(){return `<div class="demo-note">CONTROLLED DEMO — all device, fleet, inference, evidence and approval records on this page are deterministic fixtures. No production hardware or deployment claim is made.</div>`}
  function renderNav(){nav.innerHTML=D.pages.map((x,i)=>`<button data-route="${x[0]}"><i>${String(i+1).padStart(2,"0")}</i>${x[1]}</button>`).join("");nav.addEventListener("click",e=>{const b=e.target.closest("[data-route]");if(b)location.hash=b.dataset.route})}
  function route(){const id=location.hash.slice(1)||D.pages[0][0],meta=D.pages.find(x=>x[0]===id)||D.pages[0];crumb.textContent=meta[1].toUpperCase();page.innerHTML=(renderers[meta[0]]||command)();nav.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x.dataset.route===meta[0]));document.title=`${meta[1]} — Siddham Edge`;bind();window.scrollTo({top:0,behavior:"smooth"})}
  function bind(){page.querySelectorAll("[data-toast]").forEach(b=>b.addEventListener("click",()=>toast(b.dataset.toast)));page.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{b.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}))}
  function toast(text){const t=document.createElement("div");t.className="toast";t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
  function clock(){document.getElementById("clock").textContent=new Intl.DateTimeFormat("en-IN",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date())+" IST"}
  document.getElementById("menu").addEventListener("click",()=>document.querySelector(".sidebar").classList.toggle("open"));renderNav();window.addEventListener("hashchange",route);route();clock();setInterval(clock,1000);
})();
</script>
