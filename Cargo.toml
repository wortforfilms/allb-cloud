[package]
name = "maataa_sovereign_runtime"
version = "0.1.0"
edition = "2021"
authors = ["Shri Hemant Kumar Dixit <phkd@allb.xyz>"]
description = "Native Sovereign AI Runtime Kernel with Siddham NPU HAL & Brahmi Script Tokenizer"
license = "MIT OR Apache-2.0"

[lib]
name = "maataa_runtime"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "maataa_kernel"
path = "src/main.rs"

[dependencies]
# Common Core & Data Structures
phf = { version = "0.11", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
once_cell = "1.19"
hex = "0.4"
futures = "0.3.30"
tracing = "0.1.40"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

# Cryptography & Hash Functions for Z0-VESP Protocol
sha2 = "0.10.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# WASM Bindings (Activated when targeting WASM)
wasm-bindgen = "0.2"

# -----------------------------------------------------------------------------
# TARGET SPECIFIC: Native Linux / macOS Build Dependencies
# -----------------------------------------------------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2.155"
tokio = { version = "1.38", features = ["full"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
reqwest = { version = "0.13.4", features = ["json"] }

# -----------------------------------------------------------------------------
# TARGET SPECIFIC: WebAssembly (Edge Worker / Browser) Dependencies
# -----------------------------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.38", features = ["sync", "macros"] } # Lightweight sync features only
getrandom = { version = "0.2", features = ["js"] }        # Routes entropy to WebCrypto API
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory"]

[build-dependencies]
# C++ HAL Driver Compilation Hook (Native targets)
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
cc = "1.0.98"
cmake = "0.1.50"
phf_codegen = "0.11"
serde_json = "1.0"

[profile.release]
opt-level = "z"        # Optimize aggressively for binary size ("z" or "s")
lto = true             # Enable Link-Time Optimization across crate dependencies
codegen-units = 1      # Reduce parallel code generation units to maximize LTO scope
panic = "abort"        # Strip panic unwinding infrastructure and landing pads
strip = true           # Automatically strip symbols and debuginfo from final binary