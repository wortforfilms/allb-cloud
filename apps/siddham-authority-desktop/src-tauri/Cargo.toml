[package]
name = "siddham-authority-desktop"
version = "0.1.0"
description = "Standalone Siddham identity, workspace authority and evidence desktop"
authors = ["Siddham Semiconductor"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thelinep/allb"

[lib]
name = "siddham_authority_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
siddham-contracts = { path = "../../../crates/siddham-contracts" }
maataa-runtime = { package = "maataa_sovereign_runtime", path = "../../.." }
